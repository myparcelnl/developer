name: 'Build site'
description: 'Download translations and build the site'

runs:
  using: composite
  steps:
    - uses: pnpm/setup@v3
      with:
        cache: true
        require-lockfile: true

    - name: 'Import latest translations'
      shell: bash
      run: pnpm translations:import

    - name: 'Handle build cache'
      id: cache-build
      uses: actions/cache@v6
      with:
        path: src/.vuepress/dist
        key: ${{ runner.os }}-build-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*') }}
        restore-keys: |
          ${{ runner.os }}-build-${{ hashFiles('pnpm-lock.yaml') }}
          ${{ runner.os }}-build

    - shell: bash
      if: steps.cache-build.outputs.cache-hit != 'true'
      run: pnpm build
