name: 'Build site'
description: 'Download translations and build the site'

runs:
  using: composite
  steps:
    - uses: myparcelnl/actions/yarn-install@v5

    - name: 'Import latest translations'
      shell: bash
      run: yarn translations:import

    - name: 'Handle build cache'
      id: cache-build
      uses: actions/cache@v6
      with:
        # Cache .temp next to dist: on an exact cache hit the build is
        # skipped, and vitest resolves '@internal/*' from .temp.
        path: |
          src/.vuepress/dist
          src/.vuepress/.temp
        key: ${{ runner.os }}-build-v2-${{ hashFiles('**/*.lock') }}-${{ hashFiles('src/**/*') }}
        restore-keys: |
          ${{ runner.os }}-build-v2-${{ hashFiles('**/*.lock') }}
          ${{ runner.os }}-build-v2

    - shell: bash
      if: steps.cache-build.outputs.cache-hit != 'true'
      run: yarn build
